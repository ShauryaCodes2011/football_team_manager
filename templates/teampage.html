<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ teamname }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #FAF9F7;
            --bg-card: #FFFFFF;
            --text-primary: #1A1915;
            --text-secondary: #6B6560;
            --text-tertiary: #9B9590;
            --accent: #D97706;
            --accent-light: #FEF3C7;
            --border: #E8E2DA;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .page-container {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .team-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-light), #FDE68A);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 28px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .team-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px 32px;
            box-shadow: var(--shadow-sm);
            display: inline-block;
            margin-bottom: 32px;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: #B45309;
        }

        .back-link::before {
            content: '←';
            font-size: 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="team-icon">🏟️</div>
        <h1>{{ teamname }}</h1>
        <p class="team-label">Team Profile</p>

        <div class="card">
            <p>This is {{ teamname }}</p>
        </div>

        <br>
        <a href="/" class="back-link">Back to comparison</a>
    </div>

    <script>

    </script>
</body>

</html>
